name: Deploy to GitHub Pages

# Publishes the site to https://<owner>.github.io/<repo>/
#
# GitHub Pages must be enabled once for this repository:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# After that this workflow deploys on every push to main. Until it is enabled,
# the build job still runs green and only the deploy job is skipped/failed —
# nothing about the code depends on it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        # Project pages are served from /<repo>/ — assets need that prefix.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add a 404 fallback so deep links resolve
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
