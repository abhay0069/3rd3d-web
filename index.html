<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0C0A" />

    <title>LUMIÈRE — Luxury Hair & Beauty Studio | Book Your Experience</title>
    <meta
      name="description"
      content="LUMIÈRE is a modern luxury salon and beauty studio. Hair, colour, skin and bridal artistry designed around you. Explore our studio and book your experience online."
    />
    <meta name="author" content="LUMIÈRE Salon & Beauty Studio" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lumiere-salon.example/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LUMIÈRE Salon & Beauty Studio" />
    <meta property="og:title" content="LUMIÈRE — Where Beauty Becomes An Experience" />
    <meta
      property="og:description"
      content="Hair. Beauty. Confidence. Designed around you. Step inside our luxury studio and book your experience."
    />
    <meta property="og:image" content="https://lumiere-salon.example/img/salon-interior-wide.jpg" />
    <meta property="og:image:width" content="1408" />
    <meta property="og:image:height" content="768" />
    <meta property="og:image:alt" content="The LUMIÈRE salon interior, softly lit with travertine floors and warm brass accents" />
    <meta property="og:url" content="https://lumiere-salon.example/" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LUMIÈRE — Where Beauty Becomes An Experience" />
    <meta
      name="twitter:description"
      content="Hair. Beauty. Confidence. Designed around you. Book your experience at LUMIÈRE."
    />
    <meta name="twitter:image" content="https://lumiere-salon.example/img/salon-interior-wide.jpg" />

    <!-- Fonts are self-hosted via @fontsource (no third-party requests) -->
    <!-- The hero photograph doubles as the 3D scene's exit plate, so it is
         fetched at high priority from the very first byte. -->
    <link rel="preload" as="image" href="%BASE_URL%img/salon-interior-wide.jpg" fetchpriority="high" />

    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />

    <!-- Structured data: BeautySalon / LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "@id": "https://lumiere-salon.example/#salon",
        "name": "LUMIÈRE Salon & Beauty Studio",
        "description": "A modern luxury salon and beauty studio offering hair, colour, skin and bridal artistry.",
        "image": "https://lumiere-salon.example/img/salon-interior-wide.jpg",
        "url": "https://lumiere-salon.example/",
        "telephone": "+91-22-4000-1180",
        "email": "studio@lumiere-salon.example",
        "priceRange": "₹₹₹",
        "currenciesAccepted": "INR",
        "paymentAccepted": "Cash, Credit Card, UPI",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "14 Turner Road, Bandra West",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",
          "postalCode": "400050",
          "addressCountry": "IN"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 19.0596, "longitude": 72.8295 },
        "areaServed": { "@type": "City", "name": "Mumbai" },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "10:00",
            "closes": "20:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "11:00",
            "closes": "18:00"
          }
        ],
        "sameAs": ["https://www.instagram.com/", "https://www.google.com/maps"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Salon Services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Precision Haircut", "serviceType": "Hair" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Hair Styling", "serviceType": "Hair" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Global Hair Colour", "serviceType": "Hair" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Hand-Painted Highlights", "serviceType": "Hair" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Repair Hair Treatment", "serviceType": "Hair" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Signature Facial", "serviceType": "Beauty" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Advanced Skin Treatment", "serviceType": "Beauty" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Makeup Artistry", "serviceType": "Beauty" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Brow Design", "serviceType": "Beauty" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Lash Extensions", "serviceType": "Beauty" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Bridal Makeup", "serviceType": "Bridal" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Bridal Hair", "serviceType": "Bridal" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Pre-Bridal Package", "serviceType": "Bridal" } }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 48px; font-family: Georgia, serif; background: #f7f3ec; color: #1a1917">
        <h1>LUMIÈRE — Luxury Hair &amp; Beauty Studio</h1>
        <p>Hair. Beauty. Confidence. Designed around you.</p>
        <p>Please enable JavaScript for the full experience, or call us on +91 22 4000 1180 to book.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
